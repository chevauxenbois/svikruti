  - id: py-django-model-protection
    path: app/py/kyc/models.py
    code: |
      from django.db import models
      from encrypted_model_fields.fields import EncryptedCharField

      class KycRecord(models.Model):
          full_name = models.CharField(max_length=200)
          aadhaar_number = EncryptedCharField(max_length=12)
          pan_number = models.CharField(max_length=10)
          aadhaar_reference = models.CharField(max_length=72)
    expect:
      - {type: protection, field: aadhaar_number, kinds: [encrypted]}
      - {type: protection, field: pan_number, kinds: [none]}
      - {type: protection, field: aadhaar_reference, kinds: [tokenised]}

  - id: py-sqlalchemy-hash-on-write
    path: app/py/accounts/models.py
    extra_files:
      app/py/accounts/service.py: |
        import hashlib
        from .models import Account

        def create_account(session, form):
            account = Account(
                email=form["email"],
                phone_number=hashlib.sha256(form["phone_number"].encode()).hexdigest(),
            )
            session.add(account)
    code: |
      from sqlalchemy import Column, Integer, String
      from sqlalchemy.orm import declarative_base

      Base = declarative_base()

      class Account(Base):
          __tablename__ = "accounts"
          id = Column(Integer, primary_key=True)
          email = Column(String)
          phone_number = Column(String)
    expect:
      - {type: protection, field: phone_number, kinds: [hashed]}
      - {type: protection, field: email, kinds: [none]}

  - id: py-erasure-django
    path: app/py/crm/models.py
    extra_files:
      app/py/crm/privacy.py: |
        from .models import Lead, LeadNote

        def forget_lead(lead_id):
            Lead.objects.filter(pk=lead_id).delete()
    code: |
      from django.db import models

      class Lead(models.Model):
          email = models.EmailField()
          phone = models.CharField(max_length=20)

      class LeadNote(models.Model):
          lead = models.ForeignKey(Lead, on_delete=models.CASCADE)
          contact_phone = models.CharField(max_length=20)

      class Campaign(models.Model):
          owner_email = models.EmailField()
    expect:
      - {type: erasure, store: Lead, covered: true}
      - {type: erasure, store: LeadNote, covered: true}
      - {type: erasure, store: Campaign, covered: false}

