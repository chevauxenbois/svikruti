  - id: ts-prisma-erasure
    path: app/ts/schema.prisma
    extra_files:
      app/ts/gdpr.ts: |
        export async function deleteUserAccount(userId: string) {
          await prisma.user.delete({ where: { id: userId } });
        }
    code: |
      model User {
        id       String    @id
        email    String    @unique
        fullName String
        sessions Session[]
      }

      model Session {
        id        String @id
        userId    String
        user      User   @relation(fields: [userId], references: [id], onDelete: Cascade)
        ipAddress String
      }

      model Newsletter {
        id    String @id
        email String
      }
    expect:
      - {type: erasure, store: User, covered: true}
      - {type: erasure, store: Session, covered: true}
      - {type: erasure, store: Newsletter, covered: false}

