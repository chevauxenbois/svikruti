# Seeded privacy leaks for measuring what Svikruti finds and what it misses.
#
# Written before any detector was tuned against them (2026-11-16). Each case is
# a small file in a common idiom of its language. `expect` lists what a correct
# scanner must report; `type: none-*` cases are traps it must stay quiet on.
#
#   log         personal data of `category` reaches a logging call on the line containing `at`
#   flow        `category` is passed to third party `vendor` on the line containing `at`
#   vendor      third party `vendor` is detected in the file
#   protection  stored field `field` is classified with a kind in `kinds`
#   erasure     stored table/model `store` is (covered: true) or is not (covered: false) reached by erasure code
#   none-log    no logging finding anywhere in the file
#   none-flow   no processor flow anywhere in the file
#   none-vendor no third party detected in the file

cases:
  # ------------------------------------------------------------------ Python
  - id: py-log-percent
    path: app/py/log_percent.py
    code: |
      import logging
      logger = logging.getLogger(__name__)

      def register(user):
          logger.info("registered %s with phone %s", user.email, user.phone_number)
    expect:
      - {type: log, category: Contact, at: 'logger.info("registered'}

