[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svikruti"
version = "0.4.0"
description = "Open-source PrivacyOps and DPDPA evidence scanner for India"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Harsh Kahate" }
]
keywords = ["dpdpa", "privacy", "privacyops", "compliance", "security", "india"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
browser = [
  "playwright>=1.45.0",
]
app = [
  "streamlit>=1.28.1",
  "plotly>=5.17.0",
  "python-docx>=1.1.0",
  "pandas>=2.0.0",
  "openai>=1.12.0",
  "anthropic>=0.18.0",
]

[project.scripts]
svikruti = "svikruti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["svikruti*"]
