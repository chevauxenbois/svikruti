[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svikruti"
version = "0.13.0"
description = "Privacy as code: reconcile what your code does with personal data against privacy.yaml and fail the pull request on drift"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "FSL-1.1-MIT" }
authors = [
  { name = "Harsh Kahate" }
]
keywords = ["privacy-as-code", "privacy", "pii", "data-protection", "privacy-engineering", "gdpr", "dpdpa", "iso27701", "soc2", "compliance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.45.0",
]
parsers = [
  "tree-sitter-language-pack>=1.10.1",
]
app = [
  "streamlit>=1.28.1",
  "plotly>=5.17.0",
  "python-docx>=1.1.0",
  "pandas>=2.0.0",
  "openai>=1.12.0",
  "anthropic>=0.18.0",
]

[project.scripts]
svikruti = "svikruti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["svikruti*"]

[tool.setuptools.package-data]
"svikruti.pac" = ["packs/*.yaml"]
