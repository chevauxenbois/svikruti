<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sample signup</title>
  <script src="https://www.googletagmanager.com/gtag/js?id=G-EXAMPLE"></script>
</head>
<body>
  <a href="/privacy.html">Privacy Policy</a>
  <form action="/signup" method="post">
    <input name="full_name" placeholder="Full name">
    <input name="email" placeholder="Email address">
    <input name="mobile" placeholder="Mobile number">
    <input name="date_of_birth" placeholder="Date of birth">
    <button type="submit">Create account</button>
  </form>
  <p>By signing up, you consent to processing for account creation.</p>
</body>
</html>
