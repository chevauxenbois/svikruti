name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests

  privacy-as-code-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: The worked example must stay in sync with its manifest
        run: svikruti check --repo examples/privacy-as-code --privacy-file examples/privacy-as-code/privacy-notice.md --out-dir svikruti-check
      - run: cat svikruti-check/pr-comment.md >> "$GITHUB_STEP_SUMMARY"
