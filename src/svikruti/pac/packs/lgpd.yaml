id: lgpd
name: Brazil Lei Geral de Proteção de Dados Pessoais
short_name: LGPD
version: "Lei nº 13.709/2018"
verified: "2026-11-13"
source: https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm
terms: {controller: controlador, processor: operador, subject: titular, record: registro das operações de tratamento}
legal_bases: [consent, legal_obligation, public_policy, research, contract, legal_proceedings, protection_of_life, health_protection, legitimate_interests, credit_protection]
notes: >
  Article references point to the obligation a check supports. Lawful bases follow Art. 7;
  sensitive personal data is governed by Art. 11 and needs its own basis.
