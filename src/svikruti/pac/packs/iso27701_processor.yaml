id: iso27701_processor
name: "ISO/IEC 27701:2025 Privacy information management systems (PII processors)"
short_name: ISO 27701 (processor)
version: "ISO/IEC 27701:2025 (Annex A, Tables A.2 and A.3)"
verified: "2026-11-13"
source: https://www.iso.org/standard/27701
terms: {controller: customer (PII controller), processor: PII processor, subject: PII principal, record: records related to processing PII}
legal_bases: []
notes: >
  For organisations that process PII on behalf of customers. Use alongside or instead of
  `iso27701` (Table A.1, controllers). Obligations that belong to the controller (notice,
  impact assessment, children's consent, published contact) are not mapped. Titles are
  paraphrased; consult the licensed standard for normative text.
