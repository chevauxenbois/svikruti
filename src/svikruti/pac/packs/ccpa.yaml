id: ccpa
name: California Consumer Privacy Act as amended by the CPRA
short_name: CCPA/CPRA
version: "Cal. Civ. Code §§ 1798.100-1798.199.100"
verified: "2026-11-13"
source: https://leginfo.legislature.ca.gov/faces/codes_displayText.xhtml?division=3.&part=4.&lawCode=CIV&title=1.81.5
terms: {controller: business, processor: service provider or contractor, subject: consumer, record: inventory of personal information}
legal_bases: []
notes: >
  The CCPA has no lawful-basis requirement, no general record-of-processing duty and no
  transfer restriction, so OBL-01, OBL-03, OBL-09 and OBL-22 are not mapped. Breach
  notification sits in Cal. Civ. Code § 1798.82, outside the CCPA title.
